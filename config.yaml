  #######################################################################
  #///        Define cluster configuration in this file              ///#
  #######################################################################

  # Total footprint at current sizing (2026-08-06, second bump): 3 nodes
  # (1 master + 2 workers) x 4 cpus / 12288 MB = 12 vCPU / 36 GB requested
  # from the host. Host measured at the time of the first bump: 8
  # physical cores / 16 logical processors, ~48 GB RAM. CPU left
  # unchanged from the first bump -- today's real failures were memory-
  # bound, not CPU-bound: TimescaleDB alone needed a 4096Mi container
  # limit just to survive a real bulk data load + aggregation query
  # (2 separate OOM kills at 1536Mi and 2560Mi before that held), and the
  # openclaw-council agent pod separately runs up to a 4Gi limit -- both
  # landing on the SAME worker node in the 2-node fallback topology this
  # cluster kept degrading to, on top of Redis/PgBouncer/K8s system
  # overhead. 36 GB against ~48 GB host RAM leaves less headroom than the
  # first bump did (12 GB free at 3-node vs 24 GB before) -- worth
  # watching, and worth reducing NodeCount to 1 (2-node total) instead of
  # raising this further if host memory pressure becomes a real problem,
  # rather than continuing to raise per-node RAM indefinitely. Full
  # incident history: the-seventh-gate/docs/reference/session-log.md,
  # 2026-08-06 entries.

  # How many worker nodes to deploy in addition to the master node
NodeCount: 2

master:
  #######################################################################
  # Set the IP, amount of RAM memory, CPU cores and storage drives for master node
  #######################################################################
  # Bumped 2026-08-06 from 6144/2 to 8192/4: the master node's guest OS
  # became unresponsive (SSH and the Kubernetes API both hard-timed-out;
  # VirtualBox still showed it "running") after several hours of sustained
  # testing load (a load-average reading during the same session briefly
  # hit 69 on a 2-vCPU node). A `vagrant reload master` did not recover
  # it. Full incident: the-seventh-gate/docs/reference/session-log.md,
  # 2026-08-06 entries.
  memory: 12288
  cpus: 4
  master_ip: "172.16.16.100"            # ip of the master node guest VM machine
  additional_storage_drives: 0           # How many additional storage drives the machine should have
  storage_drives_size: 5               # What is the size of each additional storage drive in GB
  master_virt: False                     # Enable/Disable nested virtualization on the master node

  #######################################################################
  #     set the internal Kubernetes pod Network plugin and  CIDR        #
  #######################################################################
  pod_network_plugin: Calico              # Choose between Weave, Flannel or Cilium. Write without quotes.
  pod_network_cidr: "192.168.0.0/16"       # This is the default Flannel CIDR. Works great also with the rest.


worker:
  #######################################################################
  # Set the amount of RAM memory, CPU cores and storage drives for each worker node
  #######################################################################
  # Bumped 2026-08-06 alongside master, same reasoning -- see master's
  # comment above. Applied uniformly rather than master-only since
  # worker2 separately hit its own resource/guest-additions issues in the
  # same session (unrelated root cause, but worth the same headroom).
  memory: 12288
  cpus: 4
  additional_storage_drives: 0            # How many additional storage drives the machine should have
  storage_drives_size: 5                 # What is the size of each additional storage drive in GB
  worker_virt: False                      # Enable/Disable nested virtualization on worker nodes


  #######################################################################
  #            Define IP address range for worker nodes                 #
  #######################################################################
  ip_prefix: "172.16.16."                 # ip prefix for worker nodes
  start_index: 101                         # starting ip address - e.x. 192.168.10.101
